# This is a basic workflow to help you get started with MATLAB Actions

name: MATLAB Build

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: windows-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v6
      
      # Sets up MATLAB on a GitHub-hosted runner
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          products: MATLAB_Test
          release: R2023a

      - name: disp hello
        uses: matlab-actions/run-command@v3.2
        with:
          command: |
            disp('Hello world');
            disp('こんにちは');

      # Runs a set of commands using the runners shell
      - name: Run all tests
        uses: matlab-actions/run-tests@v3
        with:
          source-folder: code
          generate-summary: false

      # You can use "run-build" to invoke the MATLAB build tool and run build tasks
      # - name: Run the default "test" task in the build file
      #   uses: matlab-actions/run-build@v3

      # You can use "run-command" to execute custom MATLAB scripts, functions, or statements
