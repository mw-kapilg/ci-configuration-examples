# This is a basic workflow to help you get started with MATLAB Actions

name: MATLAB Build

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ mw-kapilg-summary-verification ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - run: echo "### Hello world! :rocket:" >> $GITHUB_STEP_SUMMARY
      - run: |
          echo $GITHUB_STEP_SUMMARY
          cat "$GITHUB_STEP_SUMMARY"
      - run: cat "$GITHUB_STEP_SUMMARY"
      - run: head -n 20 "$GITHUB_STEP_SUMMARY"
      # - run: grep "Hello world" $GITHUB_STEP_SUMMARY
      # - run: grep "MATLAB Build Results" "$GITHUB_STEP_SUMMARY"
      # - run: grep "MATLAB Test Results" "$GITHUB_STEP_SUMMARY"
