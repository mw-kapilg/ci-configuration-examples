# This is a basic workflow to help you get started with MATLAB Actions

name: MATLAB Build

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v6
      
      # Sets up MATLAB on a GitHub-hosted runner
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          products: MATLAB_Test

      # Runs a set of commands using the runners shell
      # - name: Run all tests
      #   uses: matlab-actions/run-tests@v3
      #   with:
      #     source-folder: code

      # You can use "run-build" to invoke the MATLAB build tool and run build tasks
      # - name: Run the default "test" task in the build file
      #   uses: matlab-actions/run-build@v3

      # Run tests with code coverage using run-tests action
      - name: Run tests with code coverage
        uses: matlab-actions/run-tests@v3
        with:
          source-folder: code
          code-coverage-cobertura-file: coverage/cobertura.xml

      # Upload code coverage artifact
      - name: Upload code coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/cobertura.xml
